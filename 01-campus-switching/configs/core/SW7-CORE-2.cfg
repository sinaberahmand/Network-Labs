 shutdown
 duplex auto

interface Ethernet3/2
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet3/3
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/0
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/1
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/2
 switchport access vlan 666
 switchport mode access
