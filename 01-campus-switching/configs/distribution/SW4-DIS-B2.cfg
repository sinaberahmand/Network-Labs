version 15.1

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config

hostname SW4-DIS-B2

boot-start-marker
boot-end-marker

no aaa new-model
no ipv6 cef
ipv6 multicast rpf use-bgp

ip cef

spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 50,60 priority 28672
spanning-tree vlan 70,80 priority 24576

vlan internal allocation policy ascending

interface Ethernet0/0
 no switchport
 ip address 192.168.145.2 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet0/1
 no switchport
 ip address 192.168.245.2 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 66
 switchport mode trunk
 duplex auto

interface Ethernet0/3
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 66
 switchport mode trunk
 duplex auto

interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 66
 switchport mode trunk
 duplex auto

interface Ethernet1/1
 no switchport
 ip address 192.168.64.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet1/2
 no switchport
 ip address 192.168.186.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet1/3
 no switchport
 ip address 192.168.56.5 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet2/0
 no switchport
 ip address 192.168.45.4 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0

interface Ethernet2/1
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet2/2
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet2/3
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet3/0
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet3/1
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet3/2
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet3/3
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/0
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/1
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/2
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet4/3
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet5/0
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet5/1
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet5/2
 switchport access vlan 666
 switchport mode access
 shutdown
 duplex auto

interface Ethernet5/3
 switchport access vlan 666
 switchport mode access
 shutdown
