interface Vlan50
 ip address 192.168.50.150 255.255.255.0
 standby use-bia
 standby 50 ip 192.168.50.1
 standby 50 priority 150
 standby 50 preempt
 ip ospf 1 area 0

interface Vlan60
 ip address 192.168.60.151 255.255.255.0
 standby use-bia
 standby 60 ip 192.168.60.1
 standby 60 priority 150
 standby 60 preempt
 ip ospf 1 area 0

interface Vlan70
 ip address 192.168.70.152 255.255.255.0
 standby use-bia
 standby 70 ip 192.168.70.1
 standby 70 priority 200
 standby 70 preempt
 ip ospf 1 area 0

interface Vlan80
 ip address 192.168.80.153 255.255.255.0
 standby use-bia
 standby 80 ip 192.168.80.1
 standby 80 priority 200
 standby 80 preempt
 ip ospf 1 area 0

router ospf 1
 router-id 0.0.0.4

no ip http server

control-plane

line con 0
 logging synchronous
line aux 0
line vty 0 4
 login

end
