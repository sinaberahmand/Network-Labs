version 12.4

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption

hostname RTR-15-NY-2

boot-start-marker
boot-end-marker

no aaa new-model
memory-size iomem 5
ip cef

no ip domain lookup

multilink bundle-name authenticated

archive
 log config
  hidekeys

vlan internal allocation policy ascending

interface Loopback100
 ip address 172.18.12.15 255.255.255.0
 ip ospf 1 area 15

interface Loopback101
 ip address 172.18.13.15 255.255.255.0
 ip ospf 1 area 15

interface Loopback102
 ip address 172.18.14.15 255.255.255.0
 ip ospf 1 area 15

interface Loopback103
 ip address 172.18.15.15 255.255.255.0
 ip ospf 1 area 15

interface FastEthernet0/0
 ip address 192.168.151.15 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 200
 ip ospf prefix-suppression
 ip ospf 1 area 15
 duplex auto
 speed auto

interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto

interface FastEthernet1/0
 no switchport
 ip address 192.168.150.15 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf prefix-suppression
 ip ospf 1 area 15

interface FastEthernet1/1

interface FastEthernet1/2

interface FastEthernet1/3

interface FastEthernet1/4

interface FastEthernet1/5

interface FastEthernet1/6

interface FastEthernet1/7

interface FastEthernet1/8

interface FastEthernet1/9

interface FastEthernet1/10

interface FastEthernet1/11

interface FastEthernet1/12

interface FastEthernet1/13

interface FastEthernet1/14

interface FastEthernet1/15

interface Vlan1
 no ip address

router ospf 1
 router-id 0.0.0.15
 log-adjacency-changes
 area 15 stub

ip forward-protocol nd

ip http server
no ip http secure-server

control-plane

line con 0
line aux 0
line vty 0 4
 login

end
