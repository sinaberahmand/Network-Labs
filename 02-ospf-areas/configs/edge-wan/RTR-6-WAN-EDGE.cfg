version 12.4

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption

hostname RTR-6-WAN-EDGE

boot-start-marker
boot-end-marker

no aaa new-model
memory-size iomem 5
ip cef

no ip domain lookup

multilink bundle-name authenticated

archive
 log config
  hidekeys

vlan internal allocation policy ascending

interface Loopback200
 ip address 172.16.100.6 255.255.255.0
 ip ospf 1 area 10

interface FastEthernet0/0
 ip address 192.168.67.6 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 2 area 0
 duplex auto
 speed auto

interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto

interface FastEthernet1/0

interface FastEthernet1/1

interface FastEthernet1/2
 no switchport
 ip address 192.168.16.6 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 10

interface FastEthernet1/3
 no switchport
 ip address 192.168.26.6 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 10

interface FastEthernet1/4

interface FastEthernet1/5

interface FastEthernet1/6

interface FastEthernet1/7

interface FastEthernet1/8

interface FastEthernet1/9

interface FastEthernet1/10

interface FastEthernet1/11

interface FastEthernet1/12

interface FastEthernet1/13

interface FastEthernet1/14

interface FastEthernet1/15

interface Vlan1
 no ip address

router ospf 1
 router-id 0.0.0.6
 log-adjacency-changes
 area 10 nssa
 redistribute ospf 2 subnets tag 6000 route-map RED-2-1

router ospf 2
 router-id 0.0.1.6
 log-adjacency-changes
 redistribute ospf 1 subnets tag 4000 route-map RED-1-2

ip forward-protocol nd

ip http server
no ip http secure-server

ip prefix-list RED-1-2-PREF seq 20 permit 172.20.4.0/22 le 32

ip prefix-list RED-2-1-PREF seq 10 permit 172.30.0.0/23 le 32

route-map RED-2-1 permit 10
 match ip address prefix-list RED-2-1-PREF

route-map RED-1-2 permit 10
 match ip address prefix-list RED-1-2-PREF

control-plane

line con 0
line aux 0
line vty 0 4

end
