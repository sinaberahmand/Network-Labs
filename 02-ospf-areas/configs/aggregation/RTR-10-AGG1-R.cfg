version 12.4

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption

hostname RTR-10-AGG1-R

boot-start-marker
boot-end-marker

no aaa new-model
memory-size iomem 5
ip cef

no ip domain lookup

multilink bundle-name authenticated

archive
 log config
  hidekeys

vlan internal allocation policy ascending

interface Loopback100
 ip address 172.16.100.10 255.255.255.255
 ip ospf 1 area 0

interface FastEthernet0/0
 ip address 192.168.120.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 12
 duplex auto
 speed auto

interface FastEthernet0/1
 ip address 192.168.130.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 13
 duplex auto
 speed auto

interface FastEthernet1/0
 no switchport
 ip address 192.168.150.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 15

interface FastEthernet1/1
 no switchport
 ip address 192.168.140.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 14

interface FastEthernet1/2
 no switchport
 ip address 192.168.21.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 0

interface FastEthernet1/3
 no switchport
 ip address 192.168.104.10 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 0

interface FastEthernet1/4

interface FastEthernet1/5

interface FastEthernet1/6

interface FastEthernet1/7

interface FastEthernet1/8

interface FastEthernet1/9

interface FastEthernet1/10

interface FastEthernet1/11

interface FastEthernet1/12

interface FastEthernet1/13

interface FastEthernet1/14

interface FastEthernet1/15

interface Vlan1
 no ip address

router ospf 1
 router-id 0.0.0.10
 log-adjacency-changes
 area 0 range 172.16.0.0 255.255.0.0
 area 12 stub
 area 12 range 172.18.0.0 255.255.252.0
 area 13 stub
 area 13 range 172.18.4.0 255.255.252.0
 area 14 stub no-summary
 area 14 range 172.18.8.0 255.255.252.0
 area 15 stub no-summary
 area 15 range 172.18.12.0 255.255.252.0

ip forward-protocol nd

ip http server
no ip http secure-server

control-plane

line con 0
line aux 0
line vty 0 4
 login

end
