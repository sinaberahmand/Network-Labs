version 12.4

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption

hostname RTR-8-AGG1-L

boot-start-marker
boot-end-marker

no aaa new-model
memory-size iomem 5
ip cef

no ip domain lookup

multilink bundle-name authenticated

archive
 log config
  hidekeys

vlan internal allocation policy ascending

interface Loopback100
 ip address 172.16.100.8 255.255.255.255
 ip ospf 1 area 0

interface FastEthernet0/0
 ip address 192.168.168.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 16
 duplex auto
 speed auto

interface FastEthernet0/1
 ip address 192.168.178.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 17
 duplex auto
 speed auto

interface FastEthernet1/0
 no switchport
 ip address 192.168.18.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 0

interface FastEthernet1/1
 no switchport
 ip address 192.168.188.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 18

interface FastEthernet1/2
 no switchport
 ip address 192.168.198.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 19

interface FastEthernet1/3
 no switchport
 ip address 192.168.38.8 255.255.255.0
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ip ospf 1 area 0

interface FastEthernet1/4

interface FastEthernet1/5

interface FastEthernet1/6

interface FastEthernet1/7

interface FastEthernet1/8

interface FastEthernet1/9

interface FastEthernet1/10

interface FastEthernet1/11

interface FastEthernet1/12

interface FastEthernet1/13

interface FastEthernet1/14

interface FastEthernet1/15

interface Vlan1
 no ip address

router ospf 1
 router-id 0.0.0.8
 log-adjacency-changes
 area 16 nssa default-information-originate
 area 16 range 172.20.0.0 255.255.252.0
 area 17 nssa default-information-originate
 area 18 nssa no-summary
 area 19 nssa no-summary
 summary-address 172.20.0.0 255.255.240.0 tag 10

ip forward-protocol nd

ip http server
no ip http secure-server

control-plane

line con 0
line aux 0
line vty 0 4
 login

end
